<html>
<style>

.card {
scale: 1.5;
    height: auto;
    width: 200px;
    margin-top: 5px;
    margin-left: 0px;
    border-radius: 5px;
}

.card-back {
    transform: scale(0.96, 1);
    width: 250px;
    margin-top: 0px;
    margin-left: -2px;
}

.card-back-stationary {
    transform: scale(0.96, 1);
    width: 250px;
    margin-top: 0px;
    margin-left: -2px;
}

#stack1 {
    position: fixed;
    margin-left: 200px;
    bottom: 30px
}

#stack2 {
    position: fixed;
}

.container {
    border-radius: 5px;
    width: 4.5em;
    height: 110px;
    overflow: hidden;
    display: flex;
    float: left;
    margin-left: -3.5em;
        margin-bottom: 0px;
    box-shadow: 1px 1px 10px rgba(0,0,0,.65);
}

.container:hover {
    margin-top: -2em;
    transition: margin-top 0.2s;
}

.raised {
    margin-top: -2em !important;
}

.dealt {
    margin-left: 200px;
    margin-bottom: -10em;
    transition: bottom 6s, margin-bottom 6s, margin-left 6s !important;
}

#cardstack {
  transition: 1s ease-in-out;
}

#back {
  transition: 1s ease-in-out;
}

@keyframes rotateY {
  to { transform: rotateY(180deg); }
}

.box {
	animation: rotateY-anim 1s linear, rotateY-anim-next-half 1s linear;
	animation-duration: 1s, 1s; 
    animation-delay: 0s, 1s;
}

.box-after {
    scale: 2;
    transition: none !important;
    		transform: translate(0em,-0.5em);

}

.box-next {
    animation: rotateY-anim-next-half 1s linear;
}

@keyframes rotateY-anim {
	0% {
		transform: rotateY(0deg);
	}

	100% {
		transform: rotateY(90deg);
	    
	}
}

@keyframes rotateY-anim-next-half {
	0% {
		transform: rotateY(90deg);
	}

	100% {
		transform: rotateY(0deg) translate(0em,-0.5em);
	    
	}
}

svg #down {
  transform: translate(10em,0px);
}

.another {
  transform: translate(30em,37em) !important;
  transition: 1s ease-in-out;
}
        
</style>
    <svg id='stack2' width="1000" height="1000" viewBox="0 0 1000 1000">
        <g>
            <image x="42" cy="200" href="../assets/CardBacksMez.png" id='card-back-stationary' class="card-back" height="150" />
        </g>
        <g id="down">

            <image x="-125" cy="200" href="../assets/CardBacksMez.png" id='back' class="card-back" height="150" onclick="(async () => {
                document.getElementById('back').classList.add('box')
                document.getElementById('down').classList.add('another')

                const wait = (ms) => new Promise((res) => setTimeout(res, ms))
                await wait(1000)
                document.getElementById('back').classList.add('box-after')
                document.getElementById('back').setAttribute('href', '../assets/AceOfDiamonds.png')
            })()"/>
        </g>
    </svg>
</html>
